[project]
name = "ghost-audit"
version = "0.1.0"
description = "Ghost Data Still Exists deletion-audit agent (HackerRank Orchestrate October 2026)"
readme = "README.md"
requires-python = ">=3.12"
# All direct dependency constraints live in this file; uv.lock pins their resolution.
dependencies = [
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
]

[dependency-groups]
dev = [
    "import-linter>=2,<3",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/ghost_audit", "code/evaluation"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF100"]

[tool.mypy]
python_version = "3.12"
mypy_path = "$MYPY_CONFIG_FILE_DIR/code"
explicit_package_bases = true
files = ["code"]
strict = true

[tool.importlinter]
root_packages = ["ghost_audit", "evaluation"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = ["ghost_audit.interfaces", "ghost_audit.infrastructure", "ghost_audit.application", "ghost_audit.domain"]

[[tool.importlinter.contracts]]
name = "Production never imports sample evaluation"
type = "forbidden"
source_modules = ["ghost_audit"]
forbidden_modules = ["evaluation"]

# Adapters serialize prepared data; only the interfaces layer composes use cases with them.
[[tool.importlinter.contracts]]
name = "Infrastructure never imports application"
type = "forbidden"
source_modules = ["ghost_audit.infrastructure"]
forbidden_modules = ["ghost_audit.application"]
